# Checks the skills' structure, manifests, links and public-safety guards, and tests pw.py on the three operating
# systems on the oldest and newest Python supported (Blender parts skip there). The blender job installs Blender as
# the bpy wheel (Python 3.13) so inspect, render, convert, printable, union and every bpy recipe run for real.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  structure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: skills, companions, manifests, links and text guards
        run: python tests/check_skills.py
      - name: pw.py tests (Blender parts skip without Blender)
        run: python tests/test_pw.py
  blender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: software OpenGL for headless rendering (runners have no GPU; Blender needs libEGL)
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libegl-mesa0 libgl1-mesa-dri libgl1
      - name: Blender as a Python module
        run: python -m pip install "bpy==5.2.2"
      - name: pw.py tests with Blender
        env:
          POLYWRIGHT_BPY_PYTHON: python
        run: python tests/test_pw.py
      - name: every bpy recipe in the docs
        env:
          POLYWRIGHT_BPY_PYTHON: python
        run: python tests/test_recipes.py
  blender-app:
    # The real Blender app where users install it, found by pw.py's install-folder search (not PATH, not the wheel):
    # /Applications/Blender.app from the Homebrew cask on macOS, the blender.org tarball unpacked in ~ on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Blender app (macOS, Homebrew cask)
        if: runner.os == 'macOS'
        run: brew install --cask blender
      - name: Blender app (Linux, blender.org tarball in ~)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libegl1 libegl-mesa0 libgl1-mesa-dri libgl1 libxkbcommon0 libsm6 libxi6 libxrender1 libxxf86vm1 libxfixes3
          f=Blender5.2/blender-5.2.2-linux-x64.tar.xz
          curl -fsSL -o /tmp/b.tar.xz https://download.blender.org/release/$f || curl -fsSL -o /tmp/b.tar.xz https://mirrors.ocf.berkeley.edu/blender/release/$f
          tar -xJf /tmp/b.tar.xz -C ~
      - name: install-folder discovery finds it
        run: python tests/check_discovery.py
      - name: pw.py tests with the Blender app
        run: python tests/test_pw.py
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: size budget (red fails)
        run: python scripts/budget.py
